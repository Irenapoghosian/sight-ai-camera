name: Sight
options:
  bundleIdPrefix: com.irenapoghosyan
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: G6AA4T82BJ

packages:
  SightKit:
    path: Packages/SightKit

targets:
  Sight:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: SightKit
        product: SightCore
      - package: SightKit
        product: CameraCapture
      - package: SightKit
        product: VisionAnalyzers
      - package: SightKit
        product: DesignSystem
      - package: SightKit
        product: CameraFeature
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Sight
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: Sight analyzes the camera image on your iPhone to recognize objects and read text. Nothing is uploaded.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.irenapoghosyan.sightcamera
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

schemes:
  Sight:
    build:
      targets:
        Sight: all
    # ⌘U on the app scheme runs every module's tests.
    test:
      gatherCoverageData: true
      targets:
        - package: SightKit/SightCoreTests
        - package: SightKit/DesignSystemTests
        - package: SightKit/CameraFeatureTests
